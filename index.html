<!DOCTYPE html>
<html lang="en">

    <title>Skylander Collection</title>
    <link rel="icon" type="image/x-icon" href="images/AirSymbolSkylanders.webp">
    <link rel="stylesheet" href="style.css">

<body>
    <nav class="navbar">
        <ul>
